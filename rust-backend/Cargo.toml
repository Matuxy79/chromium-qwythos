[package]
name = "qwythos-backend"
version = "0.1.0"
edition = "2021"
description = "Qwythos Rust backend - high-performance API server for auth, chat streaming, and model proxying"
authors = ["John Matukutire"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "timeout"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "chrono", "uuid"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (for LLM proxying)
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"] }
reqwest-eventsource = "0.6"
futures = "0.3"
tokio-stream = "0.1"

# Config & logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Misc
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
bytes = "1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
